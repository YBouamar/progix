name: progix

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: progix
      POSTGRES_USER: progix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-progix}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U progix -d progix"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Stockage de fichiers compatible S3 (version communautaire de MinIO).
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-progix}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-progix-minio}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  api:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=progix;Username=progix;Password=${POSTGRES_PASSWORD:-progix}
      ConnectionStrings__Redis: redis:6379
      Jwt__Key: ${JWT_KEY:-cle-de-developpement-a-remplacer-en-production-0123456789}
      Seed__AdminEmail: ${ADMIN_EMAIL:-directeur@progix.local}
      Seed__AdminPassword: ${ADMIN_PASSWORD:-Progix#2026}
      Seed__DemoUsers: "true"
      # Adresse publique de PROGIX, portée par le QR code des reçus de paiement.
      App__PublicUrl: ${PUBLIC_URL:-http://localhost:3000}
      Storage__Endpoint: http://minio:9000
      Storage__AccessKey: ${MINIO_ROOT_USER:-progix}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD:-progix-minio}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "8080:8080"

  web:
    build:
      context: ./web
      args:
        API_URL: http://api:8080
    depends_on:
      - api
    ports:
      - "3000:3000"

  # Données fictives (facultatif) : docker compose --profile demo run --rm demo
  demo:
    image: python:3.12-alpine
    profiles: ["demo"]
    environment:
      API_URL: http://api:8080
      DEMO_PASSWORD: ${ADMIN_PASSWORD:-Progix#2026}
    volumes:
      - ./scripts:/scripts:ro
    command: ["python", "/scripts/donnees-demo.py"]
    depends_on:
      - api

  # Tableaux d'analyse (facultatif) : docker compose --profile analyse up -d
  # Ses réglages vivent dans la base « metabase », créée au premier lancement par metabase-init.
  metabase-init:
    image: postgres:16-alpine
    profiles: ["analyse"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-progix}
    command: >
      sh -c "psql -h postgres -U progix -d progix -tc \"SELECT 1 FROM pg_database WHERE datname = 'metabase'\" | grep -q 1
      || psql -h postgres -U progix -d progix -c 'CREATE DATABASE metabase'"
    depends_on:
      postgres:
        condition: service_healthy

  metabase:
    image: metabase/metabase:latest
    profiles: ["analyse"]
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: progix
      MB_DB_PASS: ${POSTGRES_PASSWORD:-progix}
      MB_SITE_LOCALE: fr
      JAVA_TIMEZONE: Africa/Casablanca
    depends_on:
      metabase-init:
        condition: service_completed_successfully
    ports:
      - "3001:3000"

volumes:
  pgdata:
  miniodata:
