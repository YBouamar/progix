# Développement : le code est monté en volume et redémarre tout seul à chaque modification.
# Docker Compose charge ce fichier automatiquement avec « docker compose up », en plus de docker-compose.yml.
# Il ne s'applique jamais en production : DEPLOIEMENT.md utilise -f docker-compose.prod.yml, qui ignore ce fichier.
#
# Pour revenir ponctuellement aux images figées (comme en production) sur ce poste :
#   docker compose -f docker-compose.yml up --build

services:
  api:
    build:
      dockerfile: Dockerfile.dev
    working_dir: /src
    volumes:
      - ./backend:/src
    # dotnet watch recompile et relance l'API dès qu'un fichier .cs change. DOTNET_USE_POLLING_FILE_WATCHER
    # fiabilise la détection des changements sur un volume monté depuis macOS ou Windows. --non-interactive est
    # indispensable ici : sans terminal, dotnet watch ne peut pas poser sa question (y/n) sur un changement qu'il
    # ne peut pas appliquer à chaud (nouvelle route, nouveau champ...) ; avec l'option, il redémarre tout seul.
    command: ["sh", "-c", "dotnet restore Progix.sln && dotnet watch run --project src/Progix.Api/Progix.Api.csproj --no-launch-profile --non-interactive --urls http://+:8080"]
    environment:
      DOTNET_USE_POLLING_FILE_WATCHER: "true"

  web:
    build:
      dockerfile: Dockerfile.dev
    volumes:
      - ./web:/app
      # node_modules et .next restent dans des volumes à part : ceux installés sur le Mac (hôte) sont
      # compilés pour macOS et ne doivent pas être utilisés tels quels dans le conteneur Linux.
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    environment:
      API_URL: http://api:8080
      WATCHPACK_POLLING: "true"
    command: ["sh", "-c", "npm ci && npm run dev -- -H 0.0.0.0"]

volumes:
  web_node_modules:
  web_next:
